version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ipsi_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ipsi_nutricion
    ports:
      - "5432:5432"
    volumes:
      - ipsi_pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro

volumes:
  ipsi_pgdata:
